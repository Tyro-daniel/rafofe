server.port=${PORT:4000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/lms_db}
spring.datasource.username=${DB_USERNAME:lms_user}
spring.datasource.password=${DB_PASSWORD:lms_password}
spring.datasource.hikari.maximum-pool-size=10
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=26MB
app.jwt-secret=${JWT_SECRET}
app.cors.origin=${CORS_ORIGIN:http://localhost:4200}
app.upload-dir=${UPLOAD_DIR:../backend/uploads}
app.frontend-url=${APP_BASE_URL:http://localhost:4200}
app.dev-email-links=${DEV_EMAIL_LINKS:false}
app.loan-reminders.cron=${LOAN_REMINDERS_CRON:0 0 8 * * *}
app.loan-reminders.zone=${LOAN_REMINDERS_ZONE:Africa/Gaborone}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
