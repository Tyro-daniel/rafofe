# Nginx config for serving the built React SPA and proxying API calls to
# the backend container. Runs inside the frontend container; "backend" in
# proxy_pass resolves via Docker Compose's internal DNS (the service name
# in docker-compose.yml) — no hardcoded IPs, works identically in any
# Compose environment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # Baseline hardening headers. CSP is deliberately not set here because
    # a strict CSP needs to be authored against the exact external
    # resources this app loads (Google Fonts today); adding one blindly
    # risks silently breaking font loading. Flagged in README as a
    # pre-production task, not omitted by oversight.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API reverse proxy ----
    # Same-origin /api/* from the browser's point of view — this is what
    # avoids CORS entirely in production and is exactly mirrored by the
    # Vite dev proxy in vite.config.js, so app code never branches on
    # environment.
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads (KYC documents) can be larger than Nginx's small
        # default body limit — matches the 8MB limit already enforced in
        # the backend's multer config (src/routes/kyc.routes.js), so a
        # request doesn't get rejected by Nginx before ever reaching the
        # app-level validation/error message.
        client_max_body_size 10M;
    }

    # ---- Static asset caching ----
    # Vite fingerprints build output filenames (e.g. app.a1b2c3.js), so it
    # is always safe to cache these aggressively — a new deploy produces
    # new filenames, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback ----
    # Any non-file, non-/api route (e.g. /loans/3 on a hard refresh) must
    # still serve index.html so React Router can take over client-side —
    # without this, refreshing on a deep link 404s at the Nginx level.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
